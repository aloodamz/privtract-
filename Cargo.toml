[package]
name = "priv-tract"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "priv-tract"
path = "src/main.rs"

[[bin]]
name = "priv-tract-server"
path = "src/server.rs"

[dependencies]
primitive-types = "0.12"
thiserror = "1.0"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"
hex = "0.4"
axum = { version = "0.7", features = ["json"] }
reqwest = { version = "0.11", features = ["json"] }
url = "=2.5.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
bs58 = "0.5"
sha2 = "0.10"
blake3 = "1.5"


